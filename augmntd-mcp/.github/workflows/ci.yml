name: CI

on:
  push:
    branches: [main, master, atmanos-auggc-fusion]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: augmntd-mcp/package-lock.json

      - name: Install Dependencies
        working-directory: augmntd-mcp
        run: npm ci

      - name: Typecheck & Compile
        working-directory: augmntd-mcp
        run: npm run build

      - name: Run Integration Tests
        working-directory: augmntd-mcp
        run: |
          npm start &
          SERVER_PID=$!
          sleep 3
          npm test
          kill $SERVER_PID
